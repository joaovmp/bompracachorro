<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Bom Pra Cachorro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="Styles.css" />
  <!-- Para navegadores modernos -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo-small.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/logo-small.png" />

  <!-- Para Apple devices -->
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo-small.png" />
</head>
<body>

<nav class="navbar" role="navigation" aria-label="Navegação principal">
  <a href="#" aria-label="Página inicial">
    <img src="./assets/logo-small.png" class="logo" alt="Logo Bom Pra Cachorro" />
  </a>
  <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links">
    <button onclick="scrollToSection('sobre')" aria-label="Ir para seção sobre">Sobre</button>
    <button onclick="scrollToSection('ajudar')" aria-label="Ir para seção como ajudar">Como ajudar</button>
    <a href="https://instagram.com/bompracachorrovv" target="_blank" rel="noopener noreferrer" aria-label="Visitar nosso Instagram (abre em nova aba)">Instagram</a>
  </div>
  <button class="btn primary" onclick="openWhatsApp('Gostaria de fazer uma doação')" aria-label="Fazer uma doação via WhatsApp">
    Doar agora
  </button>
</nav>

<section class="hero" role="banner">
  <img class="hero-logo" src="./assets/logo_completa.png" alt="Logo completa Bom Pra Cachorro" />
  <h1>Cada vida <span>importa</span></h1>
  <p>Resgatamos, cuidamos e encontramos lares amorosos para animais abandonados.</p>
</section>

<section class="stats" role="region" aria-label="Ações principais">
  <button class="btn primary" onclick="openInstagram()" aria-label="Ver animais disponíveis para adoção no Instagram">Ver animais</button>
  <button class="btn outline" onclick="openWhatsApp()" aria-label="Entrar em contato via WhatsApp">Fale conosco</button>
</section>

<section id="sobre" class="about reveal" role="region" aria-labelledby="sobre-heading">
  <div>
    <h2 id="sobre-heading">A Bom Pra Cachorro nasceu do amor incondicional pelos animais.</h2>
  </div>
</section>

<section id="ajudar" class="help reveal" role="region" aria-labelledby="ajudar-heading">
  <h2 id="ajudar-heading" class="sr-only">Como você pode ajudar</h2>
  <button class="card" onclick="openInstagram()" aria-label="Adotar um animal">Adote</button>
  <button class="card" onclick="openWhatsApp('Quero doar')" aria-label="Fazer uma doação">Doe</button>
  <button class="card" onclick="openWhatsApp('Quero ser voluntário')" aria-label="Tornar-se voluntário">Voluntarie-se</button>
</section>

<footer role="contentinfo">
  <p>© 2026 Bom Pra Cachorro - Resgatando vidas com amor</p>
</footer>

<button class="floating-whatsapp" onclick="openWhatsApp()" aria-label="Abrir conversa no WhatsApp">
  <img src="./assets/whatsapp.png" alt="" role="presentation" />
</button>

<script src="Main.js"></script>
</body>
</html>
